# ---------------------------------------
# pyproject.toml for "pyphasediagram"
# ---------------------------------------

[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyphasediagram"
description = "A Python package implementing fast calculations of binodals of ternary systems."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Malcolm Steen", email = "malcolm.steen@stud.uni-goettingen.de" },
  { name = "David Zwicker", email = "david.zwicker@ds.mpg.de" },
]
keywords = ["Phase diagrams"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
]
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = ["mpltern >= 1.0.5, < 2"]

[project.optional-dependencies]
dev = ["pytest >= 6.0.0"]
docs = ["sphinx", "sphinx-rtd-theme"]


[project.urls]
repository = "https://github.com/steenmalcolm/pyphasediagram"

[tool.setuptools_scm]
write_to = "src/pyphasediagram/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins 
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "F",    # py-flakes
    "FA",   # flake8-future-annotations
    "FLY",  # flynt
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "INT",  # flake8-gettext
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "NPY",  # numpy rules
    "PD",   # pandas-vet 
    "PERF", # Perflint 
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "PYI",  # flake8-pyi 
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # general fixes by ruff
    "SIM",  # flake8-simplify
    "SLOT", # flake8-slots
    "TC",   # flake8-type-checking
    "TRY",  # tryceratops 
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "A005",    # allow module names that shadow python built-ins
    "B007",    # this check seems wrong since the loop variable could be used outside loop
    "B027",    # allow empty methods
    "E402",    # allow Module level import not at top of file
    "E741",    # allow ambiguous variable names
    "NPY002",  # allow legacy calls to numpy random number generator
    "PERF203", # allow try-except in loops
    "PT011",   # allow broad exceptions
    "RUF001",  # allow single greek letters
    "RUF002",  # allow using prime in docstrings
    "RUF012",  # allow using mixture of class and instance variables
    "SIM108",  # don't use ternary operator too much
]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "self",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
self = ["pde", "fixtures"]